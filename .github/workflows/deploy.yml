name: Deploy Portfolio ke AWS EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy ke AWS EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST_IP }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~
            # Jika repository sudah ada, lakukan pull; jika belum, clone
            if [ -d "Portofolio-CV" ]; then
              cd Portofolio-CV
              git pull origin main
            else
              git clone https://github.com/alfalhan/Portofolio-CV.git
              cd Portofolio-CV
            fi
            
            # Build docker image baru
            docker build -t porto-ridwan .
            
            # Hentikan dan hapus container lama jika sedang berjalan
            docker stop porto-container || true
            docker rm porto-container || true
            
            # Jalankan container baru
            docker run -d -p 80:80 --name porto-container porto-ridwan